<ion-app>
  <ion-menu contentId="main-content" type="overlay">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Menú Voces</ion-title>
      </ion-toolbar>
    </ion-header>
    
    <ion-content>
      <ion-list lines="none" *ngIf="{ role: (userRole$ | async) } as state">
        
        <ion-item routerLink="/home" button detail="false">
          <ion-icon icon="home-outline" slot="start"></ion-icon>
          <ion-label>Inicio</ion-label>
        </ion-item>

        <ion-item routerLink="/about" button detail="false">
          <ion-icon name="information-circle-outline" slot="start"></ion-icon>
          <ion-label>Quiénes somos</ion-label>
        </ion-item>

        <ion-item *ngIf="state.role === 'register'" routerLink="/evaluator" button detail="false">
          <ion-icon name="analytics-outline" slot="start"></ion-icon>
          <ion-label>Evaluador IA</ion-label>
        </ion-item>

        <ion-item *ngIf="state.role === 'admin'" routerLink="/dashboard-ong" button detail="false">
          <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
          <ion-label>Dashboard ONG</ion-label>
        </ion-item>

        <ion-item *ngIf="!state.role" routerLink="/register" button detail="false" color="light">
          <ion-icon name="person-add-outline" slot="start"></ion-icon>
          <ion-label>Registrarse</ion-label>
        </ion-item>

        <ion-item *ngIf="!state.role" routerLink="/login" button detail="false" color="secondary">
          <ion-icon name="log-in-outline" slot="start"></ion-icon>
          <ion-label>Login</ion-label>
        </ion-item>

        <ion-item *ngIf="state.role" (click)="logout()" button detail="false" color="danger">
          <ion-icon name="log-out-outline" slot="start"></ion-icon>
          <ion-label>Cerrar sesión</ion-label>
        </ion-item>

      </ion-list>
    </ion-content>
  </ion-menu>

  <div class="ion-page" id="main-content" *ngIf="{ role: (userRole$ | async) } as state">
    
    <ion-header>
      <ion-toolbar color="primary">
        <ion-buttons slot="start" class="ion-hide-md-up">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>

        <ion-title>Voces ONG</ion-title>

        <ion-buttons slot="end" class="ion-hide-md-down">
          <ion-button routerLink="/home">Inicio</ion-button>
          <ion-button routerLink="/about">Quiénes somos</ion-button>
          
          <ion-button *ngIf="state.role === 'register'" routerLink="/evaluator">
            <ion-icon name="analytics-outline" slot="start"></ion-icon>
            Evaluador IA
          </ion-button>
          
          <ion-button *ngIf="state.role === 'admin'" routerLink="/dashboard-ong">
            <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
            Dashboard ONG
          </ion-button>
          
          <ion-button *ngIf="!state.role" routerLink="/register" fill="clear" color="light">Registrarse</ion-button>
          <ion-button *ngIf="!state.role" routerLink="/login" fill="solid" color="secondary" style="--border-radius: 8px;">Login</ion-button>
          
          <ion-button *ngIf="state.role" (click)="logout()" color="light">
            <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="main-content">
      <router-outlet></router-outlet>
    </ion-content>

    <app-chat-widget *ngIf="state.role" class="chat-widget"></app-chat-widget>

    <ion-footer class="app-footer">
      <ion-toolbar color="light">
        <div class="footer-content">
          <div>
            <strong>© {{ currentYear }} Voces ONG</strong>
            <p>Promoviendo la justicia y equidad laboral en Latinoamérica.</p>
          </div>
          <div class="social">
            <a href="#">Facebook</a> |
            <a href="#">Instagram</a> |
            <a href="#">Twitter</a>
          </div>
        </div>
      </ion-toolbar>
    </ion-footer>

  </div> 
</ion-app>
