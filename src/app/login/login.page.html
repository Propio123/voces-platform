<ion-content class="ion-padding-vertical">
  <div class="login-wrapper animate__animated animate__fadeIn">
    
    <!-- Header del Formulario -->
    <header class="login-header">
      <img src="assets/logo.png" alt="Logo Voces" class="login-logo">
      <h1>Ingresar a Voces</h1>
      <p>Accede a tu panel y audita tus condiciones laborales con IA.</p>
    </header>

   <!-- En tu login.page.html, reemplaza la sección del formulario por esta: -->
<form class="login-form" data-netlify="true" (ngSubmit)="onLogin()">
  
  <!-- Campo Correo Limpio y Estabilizado -->
  <ion-input 
    label="Correo electrónico" 
    labelPlacement="floating" 
    fill="outline" 
    type="email" 
    placeholder="ejemplo@correo.com"
    [(ngModel)]="email"
    name="email"
    class="ion-margin-bottom"
    required>
    <!-- El ícono se integra dentro del componente para que Ionic calcule el espacio del clic perfectamente -->
    <ion-icon [icon]="loginIcons.mail" slot="start" class="ion-padding-horizontal"></ion-icon>
  </ion-input>
  
  <!-- Campo Contraseña Limpio y Estabilizado -->
  <ion-input 
    label="Contraseña" 
    labelPlacement="floating" 
    fill="outline" 
    type="password" 
    placeholder="••••••••"
    [(ngModel)]="password"
    name="password"
    class="ion-margin-bottom"
    required>
    <ion-icon [icon]="loginIcons.lock" slot="start" class="ion-padding-horizontal"></ion-icon>
  </ion-input>

  <!-- Botón de Iniciar Sesión -->
  <ion-button expand="block" color="primary" type="submit" class="btn-submit ion-margin-top">
    <ion-icon [icon]="loginIcons.logIn" slot="start"></ion-icon>
    Iniciar Sesión
  </ion-button>
</form>

    <!-- Enlaces de navegación inferior -->
    <footer class="login-footer">
      <p>¿No tienes una cuenta aún?</p>
      <a routerLink="/register">Regístrate de forma anónima</a>
    </footer>
    
  </div>
</ion-content>
