<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input 
      type="email" 
      label="Email" 
      labelPlacement="floating" 
      [(ngModel)]="email">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-input 
      type="password" 
      label="Contraseña" 
      labelPlacement="floating" 
      [(ngModel)]="password">
    </ion-input>
  </ion-item>

  <ion-button expand="block" color="primary" class="ion-margin-top" (click)="login()">
    Iniciar Sesión
  </ion-button>
</ion-content>
